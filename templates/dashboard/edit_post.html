{% extends 'base.html' %}

{% block content %}


<div class="row">
    {% include 'dashboard/sidebar.html' %}
    {% load crispy_forms_tags %}
    <div class="col-md-9">

        <h2> Editing post </h2>
        <form action="{% url 'edit_post' 1 %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{form | crispy}}
            <button type="submit" class="btn btn-success">Add</button>
        </form>
    </div>
</div>

{% endblock %}
