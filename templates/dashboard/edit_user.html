{% extends 'base.html' %}

{% block content %}

<div class="row">
    {% include 'dashboard/sidebar.html' %}
    {% load crispy_forms_tags %}
    {% if perms.auth.edit_user %}
    <div class="col-md-9">
        <form action="{% url 'edit_user' id %}" method="post">
            {% csrf_token %}
            {{form | crispy}}
            <button type="submit" class="btn btn-success">Add</button>
        </form>
    </div>
    {% else %}
            <h5>You don't have permission to view this page.</h5>
    {% endif %}
</div>

{% endblock %}
