{% extends 'base.html' %}

{% block content %}


<div class="row">
    {% include 'dashboard/sidebar.html' %}
    {% load crispy_forms_tags %}
    <!-- Right Side Content -->
    <div class="col-md-9">
        <h2>Edit Category - {{category}}</h2>
        <form action="{% url 'edit_category' category.id %}" method="post" style="width: 300px;">
                {% csrf_token %}
                {{form | crispy}}

                <button class="btn btn-warning" type="submit">Save</button>
            </form>
    </div>
</div>

{% endblock %}
