{% extends 'base.html' %}

{% block content %}

    <div class="row">
        {% include 'dashboard/sidebar.html' %}
        {% load crispy_forms_tags %}
        <div class="col-md-9">
            <h2>Add New Category</h2>
            <form action="{% url 'add_category' %}" method="post" style="width: 300px;">
                {% csrf_token %}
                {{form | crispy}}
                <button class="btn btn-warning" type="submit">Add</button>
            </form>
        </div>
    </div>

{% endblock %}
