<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 - Page Not Found</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
        padding: 40px;
    }

    h1 {
        font-size: 120px;
        margin: 0;
        color: #38bdf8;
    }

    h2 {
        margin: 10px 0 20px;
        font-weight: normal;
    }

    p {
        opacity: 0.8;
        margin-bottom: 30px;
    }

    a {
        text-decoration: none;
        background: #38bdf8;
        color: #0f172a;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.2s ease;
    }

    a:hover {
        background: #0ea5e9;
    }
</style>
</head>

<body>
<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you’re looking for doesn’t exist or was moved.</p>
    <a href="/">Go Home</a>
</div>
</body>
</html>
